<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<title>Předlohy k vybarvení</title>
<link rel="stylesheet" href="/web/common.css">
<style>
  body { max-width: 960px; }
  h1 { font-size: 25px; margin: 4px 0 2px; }
  .lead { color: var(--muted); margin: 0 0 6px; font-size: 15px; }
  .top-links { margin: 0 0 8px; font-size: 14px; }
  .top-links a { color: var(--muted); text-decoration: none; }

  .group-head { display: flex; align-items: baseline; justify-content: space-between;
                gap: 12px; flex-wrap: wrap; margin: 26px 0 12px; }
  .group-head h2 { font-size: 20px; text-transform: none; letter-spacing: 0;
                   color: var(--text); margin: 0; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .tcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px;
           overflow: hidden; display: flex; flex-direction: column; }
  .thumb { display: block; background: #fff; aspect-ratio: 297 / 210; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tbody { padding: 12px 14px 14px; }
  .name { font-weight: 700; font-size: 17px; }
  .motion { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions .btn { flex: 1; font-size: 14px; padding: 9px 8px; font-weight: 600; color: var(--muted); }

  /* tisk: kazda predloha na vlastni list A4 na sirku, nic jineho */
  #printPages { display: none; }
  @page { size: A4 landscape; margin: 0; }
  @media print {
    body { background: #fff; padding: 0; max-width: none; }
    body > *:not(#printPages) { display: none !important; }
    #printPages { display: block; }
    #printPages img { display: block; width: 297mm; height: 210mm; break-after: page; }
    #printPages img:last-child { break-after: auto; }
  }
</style>
</head>
<body>

<h1>Předlohy k vybarvení</h1>
<p class="lead">Každá krajina pouští jen svoje zvířata. Tiskni na 100 % (ne „přizpůsobit stránce“), list A4 na šířku.</p>
<p class="top-links"><a href="/dino3d">Všechny 3D modely</a></p>

<div id="list"></div>
<div id="printPages"></div>

<script src="/web/common.js"></script>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const ONLY = params.get("scene") || "";

const MOTION = { walk: "🚶 chodí po souši", fly: "🕊️ létá", swim: "🐟 plave", sail: "⛵ pluje" };

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text) n.textContent = text;
  return n;
}

function card(t) {
  const c = el("div", "tcard");
  const thumb = el("a", "thumb");
  thumb.href = t.template;
  thumb.target = "_blank";
  thumb.setAttribute("aria-label", "Otevřít předlohu: " + t.label);
  const img = el("img");
  img.src = t.template;
  img.alt = t.label;
  img.loading = "lazy";
  thumb.append(img);
  const body = el("div", "tbody");
  body.append(el("div", "name", t.label), el("div", "motion", MOTION[t.motion] || ""));
  const actions = el("div", "actions");
  const print = el("a", "btn", "🖨 Tisk");
  print.href = t.template;
  print.target = "_blank";
  const model = el("a", "btn", "👀 Model");
  model.href = "/dino3d#" + t.key + "?mode=walk";
  actions.append(print, model);
  body.append(actions);
  c.append(thumb, body);
  return c;
}

function printAll(items) {
  const pages = $("printPages");
  pages.replaceChildren();
  let left = items.length;
  const go = () => { if (--left <= 0) window.print(); };
  for (const t of items) {
    const img = el("img");
    img.onload = img.onerror = go;
    img.src = t.template;
    pages.append(img);
  }
}

(async () => {
  const scenes = await loadScenes();
  const r = await api("/api/templates" + (ONLY ? "?scene=" + encodeURIComponent(ONLY) : ""));
  const list = r.ok ? r.data : [];
  const box = $("list");
  const seen = new Set();
  for (const sc of scenes) {
    if (seen.has(sc.catalogue)) continue;
    seen.add(sc.catalogue);
    const items = list.filter((t) => t.scene === sc.catalogue);
    if (!items.length) continue;
    const labels = scenes.filter((x) => x.catalogue === sc.catalogue).map((x) => x.label);
    const head = el("div", "group-head");
    head.append(el("h2", null, labels.join(" / ")));
    const all = el("button", "btn", "🖨 Tisk všech (" + items.length + ")");
    all.type = "button";
    all.addEventListener("click", () => printAll(items));
    head.append(all);
    const grid = el("div", "grid");
    items.forEach((t) => grid.append(card(t)));
    box.append(head, grid);
  }
  if (ONLY && params.get("tisk")) printAll(list);
})();
</script>
</body>
</html>
