<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<title>Šablony a modely</title>
<style>
  :root {
    --bg: #12161c;
    --card: #1b212a;
    --line: #2c3542;
    --text: #e8eef6;
    --muted: #9aa7b8;
    --accent: #ffb347;
    --ok: #6ddf9c;
    --bad: #ff8f7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 20px 18px calc(28px + env(safe-area-inset-bottom));
    max-width: 960px; margin: 0 auto;
  }
  h1 { font-size: 25px; margin: 4px 0 2px; }
  .lead { color: var(--muted); margin: 0 0 6px; font-size: 15px; }
  .top-links { margin: 0 0 20px; font-size: 14px; }
  .top-links a { color: var(--muted); text-decoration: none; }
  .top-links a:hover { color: var(--text); }

  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    overflow: hidden; display: flex; flex-direction: column;
  }

  .thumb {
    display: block; background: #fff; aspect-ratio: 297 / 210;
  }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }

  .body { padding: 12px 14px 14px; }
  .name { font-weight: 700; font-size: 17px; }
  .motion { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    flex: 1; font: inherit; font-size: 14px; font-weight: 600;
    color: var(--muted); background: transparent; text-decoration: none;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 8px; text-align: center; cursor: pointer;
  }
  .btn:hover, .btn:focus-visible { color: var(--text); background: #232b36; }

  .footer-links { margin-top: 30px; text-align: center; }
  .footer-links a { color: #7fc4ff; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>

<h1>Šablony a modely</h1>
<p class="lead">Klepni na obrázek — otevře se list na tisk. Tiskni na 100 %, ne „přizpůsobit stránce“.</p>
<p class="top-links"><a href="/">Zpět na scénu</a> &middot; <a href="/dino3d">Všechny 3D modely</a></p>

<div id="list"></div>

<script type="module">
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text) n.textContent = text;
  return n;
};

// Decentni info "kde zije" misto dlouheho popisu (bod 8).
const MOTION = {
  walk: ['🚶', 'chodí po souši'],
  fly: ['🕊️', 'létá'],
  swim: ['🐟', 'plave'],
  sail: ['⛵', 'pluje'],
};
function motionLine(motion) {
  const [icon, text] = MOTION[motion] || ['🦕', 'žije v krajině'];
  return `${icon} ${text}`;
}

function card(entry) {
  const c = el('div', 'card');

  // klik na obrazek = totez co tlacitko Tisk (bod 8)
  const thumb = el('a', 'thumb');
  thumb.href = entry.template;
  thumb.target = '_blank';
  thumb.rel = 'noopener';
  thumb.setAttribute('aria-label', `Vytisknout šablonu: ${entry.label}`);
  const img = el('img');
  img.src = entry.template;
  img.alt = entry.label;
  img.loading = 'lazy';
  thumb.append(img);

  const body = el('div', 'body');
  body.append(el('div', 'name', entry.label));
  body.append(el('div', 'motion', motionLine(entry.motion)));

  const actions = el('div', 'actions');
  const print = el('a', 'btn', '🖨 Tisk');
  print.href = entry.template;
  print.target = '_blank';
  print.rel = 'noopener';
  const model = el('a', 'btn', '👀 Prohlédnout');
  model.href = `/dino3d#${entry.key}?mode=walk`;
  actions.append(print, model);
  body.append(actions);

  c.append(thumb, body);
  return c;
}

const list = await (await fetch('/api/templates')).json();
const grid = el('div', 'grid');
list.forEach((e) => grid.append(card(e)));
document.getElementById('list').append(grid);
</script>

<div class="footer-links">
  <a href="/pridat">Přidat</a> &middot; <a href="/rezim">Režim stanice</a>
</div>

</body>
</html>
