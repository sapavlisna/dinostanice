<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DinoStanice</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1418; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh;
           transition: filter 1.8s ease; }
  /* uspani (bod 6): scena jen ztmavne, rAF smycka bezi dal */
  body.sleeping canvas { filter: brightness(.22) saturate(.55); }
  body.sleeping #hint, body.sleeping #roster { opacity: 0; pointer-events: none; }
  /* krajina, nad ní 3D tvorové, nad nimi popředí (kapradí, vinětace) */
  #stage { z-index: 0; }
  #stage3d { z-index: 1; }
  #stagefx { z-index: 2; pointer-events: none; }
  #hint, #toast, #err, #roster { z-index: 3; }
  #hint {
    position: fixed; right: 24px; bottom: 62px; display: flex; align-items: center;
    gap: 16px; padding: 14px 18px; border-radius: 14px; color: #f2f6f8;
    background: rgba(8, 22, 30, .62); backdrop-filter: blur(6px);
    font: 500 17px/1.35 "Segoe UI", system-ui, sans-serif;
    transition: opacity .6s, gap .5s ease, padding .5s ease;
    box-shadow: 0 6px 30px rgba(0,0,0,.35);
  }
  #hint img {
    width: 108px; height: 108px; border-radius: 8px; background: #fff;
    transition: width .5s ease, height .5s ease;
  }
  #hint b { display: block; font-size: 20px; margin-bottom: 4px; }
  #hint span { display: block; opacity: .78; font-size: 15px; }
  /* mini stav: maly QR vpravo dole — hlavni stav
     prvnich 90 s po startu, nebo hned po prvnim add; pripominka se na chvili
     vrati k plnemu stavu */
  #hint.mini { flex-direction: column; gap: 5px; padding: 7px; border-radius: 12px; }
  #hint.mini img { width: 56px; height: 56px; }
  #hint.mini > div { display: none; }
  #toast {
    position: fixed; left: 50%; top: 36px; transform: translateX(-50%) translateY(calc(-100% - 80px));
    padding: 16px 30px; border-radius: 999px; color: #06222c; background: #ffe9a8;
    font: 600 24px/1 "Segoe UI", system-ui, sans-serif;
    transition: transform .5s cubic-bezier(.2,1.4,.4,1);
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  /* ladici panel (web/tune.js), klavesa d */
  #tune {
    position: fixed; left: 16px; top: 16px; z-index: 4; max-height: 90vh; overflow: auto;
    padding: 14px 16px; border-radius: 12px; color: #dfeaf0;
    background: rgba(6, 18, 26, .88); backdrop-filter: blur(6px);
    font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    box-shadow: 0 8px 34px rgba(0,0,0,.45);
  }
  #tune h2 { margin: 0 0 10px; font: 600 12px/1 "Segoe UI", system-ui, sans-serif;
             letter-spacing: .09em; text-transform: uppercase; color: #86b6cf; }
  #tune table { border-collapse: collapse; }
  #tune th { padding: 0 10px 6px 0; text-align: left; font-weight: 500; color: #86b6cf; }
  #tune td { padding: 2px 10px 2px 0; white-space: nowrap; }
  #tune .who { font-weight: 600; }
  #tune .out { color: #9fb6c2; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  #tune input {
    width: 68px; padding: 4px 6px; border: 1px solid rgba(159, 214, 255, .25);
    border-radius: 6px; background: rgba(255,255,255,.06); color: #eaf4f8;
    font: 13px ui-monospace, Consolas, monospace;
  }
  #tune input:focus { outline: none; border-color: #9fd6ff; }
  #tune .tools { display: flex; gap: 8px; margin-top: 12px; }
  #tune button {
    padding: 5px 10px; border: 1px solid rgba(159, 214, 255, .25); border-radius: 6px;
    background: rgba(255,255,255,.06); color: #cfe6f2; font: 12px inherit; cursor: pointer;
  }
  #tune button:hover { background: rgba(159, 214, 255, .16); }
  #tune button:disabled { opacity: .45; cursor: default; }
  /* sekce Trasy (editor waypointu, web/tune.js) */
  #tune .tools { align-items: center; flex-wrap: wrap; }
  #tune select {
    max-width: 150px; padding: 4px 6px; border: 1px solid rgba(159, 214, 255, .25);
    border-radius: 6px; background: rgba(6, 18, 26, .9); color: #eaf4f8; font: 12px inherit;
  }
  #tune label { color: #cfe6f2; font-size: 12px; white-space: nowrap; cursor: pointer; }
  #tune .hint { margin-top: 8px; max-width: 330px; color: #7f98a5; font-size: 11px; }
  #tune h2 + .tools { margin-top: 0; }
  #err { position: fixed; left: 16px; bottom: 54px; color: #ff9b9b; font: 13px monospace; opacity: .7; }
  /* lista: pocet zvirat a seznam kdo je ve scene (web/roster.js), klavesa i */
  #roster {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 20px;
    align-items: baseline; padding: 9px 20px; color: #cfe0e8;
    background: rgba(6, 18, 26, .72); backdrop-filter: blur(6px);
    font: 14px/1.3 "Segoe UI", system-ui, sans-serif;
  }
  #tally { font-weight: 700; white-space: nowrap; }
  #feed { display: flex; flex-wrap: wrap; gap: 4px 18px; min-width: 0; }
  #feed .ev { white-space: nowrap; }
  /* zvirata od deti svitivji, ukazkova z katalogu ztlumena */
  #feed .ev.demo { opacity: .6; }
  #err.fatal {
    left: 50%; bottom: auto; top: 40%; transform: translateX(-50%);
    max-width: 70vw; padding: 18px 26px; border-radius: 14px; opacity: 1;
    background: rgba(60, 12, 12, .88); color: #ffd9d4;
    font: 500 20px/1.4 "Segoe UI", system-ui, sans-serif; text-align: center;
  }
  /* varovani pred usnutim (bod 6): banner nahore uprostred, mimo #hint
     (vpravo nahore), #err (vlevo dole) i #toast (ten se ukazuje jen chvili) */
  #idlebar {
    position: fixed; left: 50%; top: 0; transform: translateX(-50%) translateY(-110%);
    z-index: 3; padding: 13px 30px; border-radius: 0 0 16px 16px;
    background: rgba(38, 30, 8, .9); color: #ffe9a8; backdrop-filter: blur(6px);
    font: 600 21px/1.3 "Segoe UI", system-ui, sans-serif;
    box-shadow: 0 8px 34px rgba(0,0,0,.4); transition: transform .5s ease;
    white-space: nowrap;
  }
  #idlebar.show { transform: translateX(-50%) translateY(0); }
  /* spici stanice: overlay pres vsechno vc. ladicich panelu */
  #sleep {
    position: fixed; inset: 0; z-index: 6; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; color: #dfe9f0; text-align: center;
    font: 500 22px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  #sleep.show { display: flex; }
  #sleep b { display: block; font-size: 40px; margin-bottom: 6px; }
  #sleep img {
    width: 240px; height: 240px; border-radius: 16px; background: #fff;
    padding: 10px; box-shadow: 0 14px 60px rgba(0,0,0,.55);
  }
  #sleep .note { opacity: .75; font-size: 18px; }
  /* televize bez stanice: kod pro admina, krajina bezi v pozadi */
  #pair {
    position: fixed; inset: 0; z-index: 6; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; color: #dfe9f0; text-align: center; background: rgba(8, 12, 18, .55);
    font: 500 22px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  #pair.show { display: flex; }
  #pair b { display: block; font-size: 40px; margin-bottom: 6px; }
  #pair #pairurl { font-weight: 700; color: #ffd28a; }
  #paircode {
    font: 800 120px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .18em;
    padding: 18px 36px 18px 54px; border-radius: 24px; background: rgba(0,0,0,.45);
  }
  #pair .note { opacity: .75; font-size: 18px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<canvas id="stage3d"></canvas>
<canvas id="stagefx"></canvas>
<div id="hint">
  <img id="qr" alt="">
  <div>
    <b>Přidej svého dinosaura</b>
    <span>Naskenuj kód a vyfoť vybarvený obrázek</span>
  </div>
</div>
<div id="toast"></div>
<div id="err"></div>
<div id="idlebar"></div>
<div id="sleep">
  <div><b>Stanice spí 💤</b>Naskenuj kód a zvířata se proberou</div>
  <img id="sleepqr" alt="">
  <div class="note">Nikdo nezmizel — všichni jen spí a čekají na tebe.</div>
</div>
<div id="pair">
  <div><b>Připoj televizi</b>Ve správě na <span id="pairurl"></span> zadej u stanice kód</div>
  <div id="paircode">····</div>
  <div class="note">Kód platí 10 minut. Jen pro dospělé, kteří stanici spravují.</div>
</div>
<div id="roster">
  <div id="tally"></div>
  <div id="feed"></div>
</div>
<script>
/* Diagnostika pro prohlizece televizi: zamerne ES5 a mimo moduly, aby bezela
   i tam, kde scena sama nenastartuje. Vysledky jdou do logu serveru. */
(function () {
  var t0 = Date.now(), frames = 0, errs = [];
  function send(kind, data) {
    try {
      var x = new XMLHttpRequest();
      x.open('POST', '/api/clientlog', true);
      x.setRequestHeader('Content-Type', 'text/plain');
      x.send(kind + ' t=' + ((Date.now() - t0) / 1000).toFixed(1) + 's ' + JSON.stringify(data));
    } catch (e) {}
  }
  function show(msg) {
    if (!/[?&]diag/.test(location.search)) return;
    var d = document.getElementById('diagbox');
    if (!d) {
      d = document.createElement('pre');
      d.id = 'diagbox';
      d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99;max-width:100%;'
        + 'margin:0;padding:8px;background:rgba(0,0,0,.8);color:#ff8;font:14px monospace;'
        + 'white-space:pre-wrap';
      document.body.appendChild(d);
    }
    d.textContent += msg + '\n';
  }
  window.addEventListener('error', function (e) {
    var m = (e.message || 'resource error') + ' @' + (e.filename || (e.target && e.target.src) || '')
      + ':' + (e.lineno || '');
    errs.push(m); send('error', m); show('ERR ' + m);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var m = 'rejection: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason);
    errs.push(m); send('error', m); show('ERR ' + m);
  });
  function gpu() {
    try {
      var c = document.createElement('canvas');
      var g = c.getContext('webgl2') ? 'webgl2' : (c.getContext('webgl') ? 'webgl1' : 'none');
      var gl = c.getContext(g === 'none' ? 'webgl' : g);
      var ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
      return g + ' ' + (ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '?');
    } catch (e) { return 'err ' + e; }
  }
  var info = {
    screen: screen.width + 'x' + screen.height + '@' + (window.devicePixelRatio || 1),
    importmap: !!(HTMLScriptElement.supports && HTMLScriptElement.supports('importmap')),
    module: 'noModule' in document.createElement('script'),
    gpu: gpu()
  };
  send('start', info); show('UA ' + navigator.userAgent + '\n' + JSON.stringify(info));
  (function tick() { frames++; requestAnimationFrame(tick); })();
  var last = 0, lastT = Date.now();
  [5, 15, 30, 60, 120].forEach(function (s) {
    setTimeout(function () {
      var now = Date.now(), fps = (frames - last) * 1000 / (now - lastT);
      last = frames; lastT = now;
      var m = { fps: +fps.toFixed(1), errors: errs.length,
                ready: !!window.__ready };
      send('fps', m); show('fps ' + JSON.stringify(m));
    }, s * 1000);
  });
})();
</script>
<script type="importmap">
{ "imports": { "three": "/web/vendor/three.module.min.js" } }
</script>
<script type="module" src="/web/scene.js"></script>
</body>
</html>
