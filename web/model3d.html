<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinosauří stanice — 3D model</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: #10151b; color: #dfe7ef;
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; background: #18202a; border-bottom: 1px solid #26313d;
  }
  h1 { margin: 0 14px 0 0; font-size: 17px; font-weight: 600; letter-spacing: .2px; }
  select, button {
    font: inherit; color: #e8eff6; background: #223040;
    border: 1px solid #33465b; border-radius: 7px; padding: 6px 12px; cursor: pointer;
  }
  button:hover, select:hover { background: #2b3d51; }
  #view { flex: 1; width: 100%; display: block; min-height: 0; }
  footer {
    display: flex; gap: 18px; flex-wrap: wrap;
    padding: 8px 16px; background: #18202a; border-top: 1px solid #26313d;
    font-size: 13px; color: #93a4b6;
  }
  #notes { color: #e0b464; }
  #status.bad { color: #f08a7a; }
  .hint { margin-left: auto; color: #6c7f92; }
</style>
</head>
<body>

<header>
  <h1>3D model z vybarvené kresby</h1>
  <select id="catch"></select>
  <button id="play">Pauza</button>
  <button id="spin">Zastavit otáčení</button>
  <button id="wire">Síť</button>
  <button id="flat">Bez textury</button>
  <span id="status"></span>
</header>

<canvas id="view"></canvas>

<footer>
  <span id="info"></span>
  <span id="notes"></span>
  <span class="hint">táhni myší = otáčení · kolečko = přiblížení · pravé tlačítko = posun</span>
</footer>

<script type="importmap">
{ "imports": { "three": "/web/vendor/three.module.min.js" } }
</script>
<script type="module" src="/web/model3d.js"></script>

</body>
</html>
