<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<title>Přidat dinosaura</title>
<style>
  :root {
    --bg: #12161c;
    --card: #1b212a;
    --line: #2c3542;
    --text: #e8eef6;
    --muted: #9aa7b8;
    --accent: #ffb347;
    --accent-dark: #2a1f0e;
    --ok: #6ddf9c;
    --bad: #ff8f7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 20px 18px calc(28px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 25px; margin: 4px 0 2px; }
  .lead { color: var(--muted); margin: 0 0 22px; font-size: 15px; }

  .shoot {
    display: block; width: 100%; border: none; border-radius: 20px;
    background: var(--accent); color: #1a1206;
    font-size: 22px; font-weight: 700; padding: 26px 18px;
    text-align: center; cursor: pointer;
    box-shadow: 0 10px 24px rgba(255, 179, 71, .18);
  }
  .shoot:active { transform: translateY(2px); }
  .shoot small { display: block; font-size: 14px; font-weight: 500; opacity: .7; margin-top: 4px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 16px; margin-top: 18px;
  }
  .hidden { display: none !important; }

  #preview { width: 100%; border-radius: 12px; display: block; background: #000; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }

  label.field { display: block; margin: 18px 0 8px; font-size: 15px; color: var(--muted); }
  input[type=text] {
    width: 100%; padding: 15px 14px; font-size: 18px; border-radius: 14px;
    border: 1px solid var(--line); background: #10151b; color: var(--text);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }

  .row { display: flex; gap: 10px; margin-top: 16px; }
  button.action {
    flex: 1; border: none; border-radius: 16px; padding: 18px 12px;
    font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .primary { background: var(--accent); color: #1a1206; }
  .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line) !important; flex: 0 0 40%; }
  button:disabled { opacity: .45; }

  .status { margin-top: 20px; font-size: 17px; }
  .spinner {
    display: inline-block; width: 18px; height: 18px; vertical-align: -3px;
    margin-right: 10px; border: 3px solid rgba(255,255,255,.2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result { border-left: 4px solid var(--ok); padding: 14px 16px; background: #16241d; border-radius: 12px; }
  .result strong { font-size: 20px; }
  .error { border-left: 4px solid var(--bad); padding: 14px 16px; background: #26191a; border-radius: 12px; }
  .error .why { color: var(--bad); font-weight: 600; }
  .hints { margin: 10px 0 0; padding-left: 20px; color: var(--muted); font-size: 15px; }
  .hints li { margin: 4px 0; }
</style>
</head>
<body>

<h1>Přidat dinosaura</h1>
<p class="lead">Vybarvi si obrázek, vyfoť ho a tvůj dinosaurus vyrazí do krajiny na televizi.</p>

<label class="shoot" for="file">
  📷 Vyfotit dinosaura
  <small>na počítači vybere soubor z disku</small>
</label>
<input id="file" type="file" accept="image/*" capture="environment">

<div id="sheet" class="card hidden">
  <img id="preview" alt="Náhled fotky">
  <div class="meta" id="meta"></div>

  <label class="field" for="name">Jak se jmenuješ? (nemusíš vyplňovat)</label>
  <input id="name" type="text" maxlength="40" autocomplete="off" placeholder="třeba Anička">

  <div class="row">
    <button class="action ghost" id="again" type="button">Jiná fotka</button>
    <button class="action primary" id="send" type="button">Odeslat</button>
  </div>
</div>

<div id="status" class="status"></div>

<script>
"use strict";

const MAX_SIDE = 2000;
const QUALITY = 0.85;

const fileInput = document.getElementById("file");
const sheet = document.getElementById("sheet");
const preview = document.getElementById("preview");
const metaBox = document.getElementById("meta");
const nameInput = document.getElementById("name");
const sendBtn = document.getElementById("send");
const againBtn = document.getElementById("again");
const statusBox = document.getElementById("status");

let pending = null;
let previewUrl = null;

function setStatus(html) { statusBox.innerHTML = html; }

function fail(why, hints) {
  const list = (hints || []).map(h => "<li>" + h + "</li>").join("");
  setStatus('<div class="error"><div class="why">' + why + "</div>" +
            (list ? '<ul class="hints">' + list + "</ul>" : "") + "</div>");
}

function kb(bytes) { return Math.round(bytes / 1024) + " kB"; }

async function loadBitmap(file) {
  if (window.createImageBitmap) {
    try {
      return await createImageBitmap(file, { imageOrientation: "from-image" });
    } catch (e) { /* Safari without the option, fall through */ }
  }
  return await new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("nelze načíst")); };
    img.src = url;
  });
}

// Phones shoot 12 Mpx; the sheet is legible far below that and the upload is
// then instant even on a weak wifi.
async function shrink(file) {
  const src = await loadBitmap(file);
  const w = src.width || src.naturalWidth;
  const h = src.height || src.naturalHeight;
  if (!w || !h) throw new Error("prázdný obrázek");

  const scale = Math.min(1, MAX_SIDE / Math.max(w, h));
  const cw = Math.max(1, Math.round(w * scale));
  const ch = Math.max(1, Math.round(h * scale));

  const canvas = document.createElement("canvas");
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(src, 0, 0, cw, ch);
  if (src.close) src.close();

  const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", QUALITY));
  if (!blob) throw new Error("nelze zmenšit");
  return { blob, w: cw, h: ch };
}

fileInput.addEventListener("change", async () => {
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;
  setStatus('<span class="spinner"></span>Připravuji fotku…');
  sheet.classList.add("hidden");
  try {
    const out = await shrink(file);
    pending = out.blob;
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(out.blob);
    preview.src = previewUrl;
    metaBox.textContent = out.w + " × " + out.h + " px · " + kb(out.blob.size);
    sheet.classList.remove("hidden");
    sendBtn.disabled = false;
    setStatus("");
    sheet.scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (e) {
    pending = null;
    fail("Fotku se nepodařilo načíst.", ["Zkus ji vyfotit znovu."]);
  }
  fileInput.value = "";
});

againBtn.addEventListener("click", () => fileInput.click());

sendBtn.addEventListener("click", async () => {
  if (!pending) return;
  sendBtn.disabled = true;
  againBtn.disabled = true;
  setStatus('<span class="spinner"></span>Oživuji dinosaura…');

  const body = new FormData();
  body.append("photo", pending, "photo.jpg");
  body.append("name", nameInput.value.trim());

  let res, data;
  try {
    res = await fetch("/api/upload", { method: "POST", body });
    data = await res.json();
  } catch (e) {
    againBtn.disabled = false;
    sendBtn.disabled = false;
    fail("Nepodařilo se spojit se stanicí.", [
      "Zkontroluj, že jsi na stejné wifi jako televize.",
      "Pak zkus Odeslat znovu."
    ]);
    return;
  }

  againBtn.disabled = false;
  if (!res.ok || !data || !data.ok) {
    sendBtn.disabled = false;
    fail((data && data.error ? data.error : "něco se pokazilo") + ".", [
      "Na fotce musí být vidět všechny čtyři černé čtverečky v rozích listu.",
      "Foť shora, ať je list rovně a celý v záběru.",
      "Ať na papír nesvítí lampa přímo — leskne se to."
    ]);
    return;
  }

  const who = data.name ? data.name + ", tvůj " + data.label : "Tvůj " + data.label;
  const pct = Math.round((data.coverage || 0) * 100);
  setStatus('<div class="result"><strong>' + who + " vyrazil do krajiny!</strong>" +
            '<div class="meta">Vybarveno na ' + pct + " % · zpracováno za " +
            (data.took_ms || 0) + " ms</div></div>");
  pending = null;
  sheet.classList.add("hidden");
  nameInput.value = nameInput.value.trim();
});
</script>
</body>
</html>
