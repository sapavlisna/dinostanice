<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<title>Přidat zvíře</title>
<link rel="stylesheet" href="/web/common.css">
<style>
  body { font-size: 17px; padding-top: 20px; }
  h1 { font-size: 25px; margin: 4px 0 2px; }
  .lead { color: var(--muted); margin: 0 0 22px; font-size: 15px; }

  .shoot, .feed-btn {
    display: block; width: 100%; border: none; border-radius: 20px;
    text-align: center; cursor: pointer; font-weight: 700;
  }
  .shoot {
    background: var(--accent); color: var(--accent-ink);
    font-size: 22px; padding: 26px 18px;
    box-shadow: 0 10px 24px rgba(255, 179, 71, .18);
  }
  .feed-btn {
    margin-top: 14px; background: #2e4a35; color: #d9f2e0;
    font-size: 20px; padding: 20px 18px;
    box-shadow: 0 8px 20px rgba(46, 74, 53, .3);
  }
  .shoot:active, .feed-btn:active { transform: translateY(2px); }
  .feed-btn:disabled { opacity: .55; }
  .shoot small, .feed-btn small {
    display: block; font-size: 14px; font-weight: 500; opacity: .7; margin-top: 4px;
  }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  #feedNote { display: block; margin-top: 8px; text-align: center; font-size: 14px; min-height: 1.3em; }
  #feedNote.ok { color: var(--ok); }
  #feedNote.bad { color: var(--bad); }

  #preview { width: 100%; border-radius: 12px; display: block; background: #000; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  label.field { display: block; margin: 18px 0 8px; font-size: 15px; color: var(--muted); }

  .row { display: flex; gap: 10px; margin-top: 16px; }
  .row .btn { flex: 1; padding: 16px 12px; font-size: 18px; border-radius: 16px; }
  .row .btn.ghost { flex: 0 0 40%; }

  #status { margin-top: 20px; font-size: 17px; }
  .result { border-left: 4px solid var(--ok); padding: 14px 16px; background: #16241d; border-radius: 12px; }
  .result strong { font-size: 20px; }
  .error { border-left: 4px solid var(--bad); padding: 14px 16px; background: #26191a; border-radius: 12px; }
  .error .why { color: var(--bad); font-weight: 600; }
  .hints { margin: 10px 0 0; padding-left: 20px; color: var(--muted); font-size: 15px; }
  .hints li { margin: 4px 0; }

  .mine-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 2px;
    border-bottom: 1px solid var(--line);
  }
  .mine-row:last-child { border-bottom: none; }
  .mine-row.confirm { flex-direction: column; align-items: stretch; gap: 0; }
  .mine-thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: contain; background: #fff; flex: none; }
  .mine-info { flex: 1; min-width: 0; }
  .mine-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mine-kind { color: var(--muted); font-size: 13px; }
  .mine-del {
    flex: none; width: 42px; height: 42px; border-radius: 50%; border: none;
    background: #232b36; color: var(--bad); font-size: 19px;
  }
  .empty { color: var(--muted); font-size: 15px; }

  .stay-foot { margin-top: 26px; text-align: center; }
  .stay-foot button {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 999px; padding: 10px 18px; font-size: 15px;
  }
  #stayNote { display: block; margin-top: 8px; color: var(--ok); font-size: 14px; }

  .ended { text-align: center; margin-top: 18vh; }
  .ended .big { font-size: 56px; }
</style>
</head>
<body>

<div id="ended" class="ended hidden">
  <div class="big">🌙</div>
  <h1>Tahle stanice už neběží</h1>
  <p class="lead">Požádej dospělého o nový QR kód.</p>
</div>

<main id="page">
  <h1 id="title">Přidat zvíře</h1>
  <p class="lead" id="lead">Vybarvi si obrázek, vyfoť ho a tvoje zvíře vyrazí do krajiny na televizi.</p>

  <label class="shoot" for="file">
    <span id="shootText">📷 Vyfotit obrázek</span>
    <small>na počítači vybere soubor z disku</small>
  </label>
  <input id="file" type="file" accept="image/*" capture="environment">

  <div id="sheet" class="card hidden">
    <img id="preview" alt="Náhled fotky">
    <div class="meta" id="meta"></div>
    <label class="field" for="name">Jak se jmenuješ? (nemusíš vyplňovat)</label>
    <input id="name" type="text" maxlength="40" autocomplete="off" placeholder="třeba Anička">
    <div class="row">
      <button class="btn ghost" id="again" type="button">Jiná fotka</button>
      <button class="btn primary" id="send" type="button">Odeslat</button>
    </div>
  </div>

  <div id="status"></div>

  <button class="feed-btn" id="feedBtn" type="button">
    🍖 Hodit žrádlo
    <small id="feedHint"></small>
  </button>
  <span id="feedNote"></span>

  <section>
    <h2 id="allowedTitle">Co sem teď patří</h2>
    <div class="sheets" id="allowed"></div>
    <p class="hint">Vybarvi si jednoho z nich — jiná zvířata tahle krajina nepustí.</p>
  </section>

  <section>
    <h2>Moje zvířata</h2>
    <div id="mine"><div class="empty">Zatím jsi nic nepřidal(a).</div></div>
  </section>

  <div class="stay-foot">
    <button id="stay" type="button">Ještě chvíli ⏰</button>
    <span id="stayNote"></span>
  </div>
</main>

<script src="/web/common.js"></script>
<script>
"use strict";

const MAX_SIDE = 2000;
const QUALITY = 0.85;
const STATION = SID || "tv";
const DEVICE = deviceId();

let scene = null;          // aktivni krajina stanice (z /api/scenes)
let pending = null;
let previewUrl = null;

function showEnded() {
  $("page").classList.add("hidden");
  $("ended").classList.remove("hidden");
  document.title = "Stanice neběží";
}

// --- Texty a povolena zvirata podle bezici krajiny ----------------------------

async function loadScene() {
  const r = await api("/api/scene/active?s=" + encodeURIComponent(STATION));
  if (r.status === 404) { showEnded(); return false; }
  if (!r.ok) return true;
  const list = await loadScenes();
  scene = list.find((s) => s.key === r.data.scene) || null;
  if (scene) {
    document.title = "Přidat " + scene.accusative;
    $("title").textContent = "Přidat " + scene.accusative;
    $("shootText").textContent = "📷 Vyfotit " + scene.accusative;
    $("feedHint").textContent = scene.feedHint;
    $("lead").textContent = "Na televizi je " + scene.label +
      ". Vybarvi si obrázek, vyfoť ho a pustíš ho do krajiny.";
  }
  const t = await api("/api/templates?scene=" + encodeURIComponent(r.data.scene));
  const box = $("allowed");
  box.replaceChildren();
  for (const s of (t.ok ? t.data : [])) {
    const card = document.createElement("div");
    card.className = "sheet-thumb";
    const img = document.createElement("img");
    img.src = s.template;
    img.alt = "";
    img.loading = "lazy";
    const name = document.createElement("span");
    name.textContent = s.label;
    card.append(img, name);
    box.append(card);
  }
  return true;
}

// --- Foceni a odeslani -------------------------------------------------------

const statusBox = $("status");

function say(kind, title, lines) {
  const box = document.createElement("div");
  box.className = kind;
  const head = document.createElement(kind === "result" ? "strong" : "div");
  if (kind === "error") head.className = "why";
  head.textContent = title;
  box.append(head);
  if (lines && lines.length) {
    const ul = document.createElement("ul");
    ul.className = "hints";
    for (const l of lines) {
      const li = document.createElement("li");
      li.textContent = l;
      ul.append(li);
    }
    box.append(ul);
  }
  statusBox.replaceChildren(box);
}

function busy(text) {
  const sp = document.createElement("span");
  sp.className = "spinner";
  statusBox.replaceChildren(sp, document.createTextNode(text));
}

async function loadBitmap(file) {
  if (window.createImageBitmap) {
    try {
      return await createImageBitmap(file, { imageOrientation: "from-image" });
    } catch (e) { /* Safari bez volby, zkusi se <img> */ }
  }
  return await new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("nelze načíst")); };
    img.src = url;
  });
}

// Telefony foti 12 Mpx; list je citelny hluboko pod tim a upload je pak
// okamzity i na slabe wifi.
async function shrink(file) {
  const src = await loadBitmap(file);
  const w = src.width || src.naturalWidth;
  const h = src.height || src.naturalHeight;
  if (!w || !h) throw new Error("prázdný obrázek");
  const scale = Math.min(1, MAX_SIDE / Math.max(w, h));
  const cw = Math.max(1, Math.round(w * scale));
  const ch = Math.max(1, Math.round(h * scale));
  const canvas = document.createElement("canvas");
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(src, 0, 0, cw, ch);
  if (src.close) src.close();
  const blob = await new Promise((res) => canvas.toBlob(res, "image/jpeg", QUALITY));
  if (!blob) throw new Error("nelze zmenšit");
  return { blob, w: cw, h: ch };
}

$("file").addEventListener("change", async () => {
  const file = $("file").files && $("file").files[0];
  if (!file) return;
  busy("Připravuji fotku…");
  $("sheet").classList.add("hidden");
  try {
    const out = await shrink(file);
    pending = out.blob;
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(out.blob);
    $("preview").src = previewUrl;
    $("meta").textContent = out.w + " × " + out.h + " px · " + Math.round(out.blob.size / 1024) + " kB";
    $("sheet").classList.remove("hidden");
    $("send").disabled = false;
    statusBox.replaceChildren();
    $("sheet").scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (e) {
    pending = null;
    say("error", "Fotku se nepodařilo načíst.", ["Zkus ji vyfotit znovu."]);
  }
  $("file").value = "";
});

$("again").addEventListener("click", () => $("file").click());

$("send").addEventListener("click", async () => {
  if (!pending) return;
  $("send").disabled = $("again").disabled = true;
  busy("Oživuji " + (scene ? scene.accusative : "zvíře") + "…");

  const body = new FormData();
  body.append("photo", pending, "photo.jpg");
  body.append("name", $("name").value.trim());
  body.append("s", STATION);
  body.append("device", DEVICE);

  let res, data;
  try {
    res = await fetch("/api/upload", { method: "POST", body });
    data = await res.json();
  } catch (e) {
    $("send").disabled = $("again").disabled = false;
    say("error", "Nepodařilo se spojit se stanicí.", [
      "Zkontroluj, že jsi na stejné wifi jako televize.", "Pak zkus Odeslat znovu."]);
    return;
  }
  $("again").disabled = false;

  if (res.status === 404) { showEnded(); return; }
  if (res.status === 409 && data && data.foreign) {
    // jine zvire nez z bezici krajiny: fotka je v poradku, jen ne sem
    pending = null;
    $("sheet").classList.add("hidden");
    say("error", data.error, data.allowed && data.allowed.length
      ? ["Sem patří: " + data.allowed.join(", ") + "."] : []);
    return;
  }
  if (!res.ok || !data || !data.ok) {
    $("send").disabled = false;
    say("error", (data && data.error ? data.error : "něco se pokazilo") + ".", [
      "Na fotce musí být vidět všechny čtyři černé čtverečky v rozích listu.",
      "Foť shora, ať je list rovně a celý v záběru.",
      "Ať na papír nesvítí lampa přímo — leskne se to."]);
    return;
  }

  const who = data.name ? data.name + ", tvůj " + data.label : "Tvůj " + data.label;
  say("result", who + " vyrazil do krajiny — sleduj levý kraj televize!");
  pending = null;
  $("sheet").classList.add("hidden");
  loadMine();
});

// --- Moje zvirata ------------------------------------------------------------

function mineRow(r) {
  const row = document.createElement("div");
  row.className = "mine-row";
  const thumb = document.createElement("img");
  thumb.className = "mine-thumb";
  thumb.src = "/catch/" + r.id + "/texture.png";
  thumb.alt = "";
  const info = document.createElement("div");
  info.className = "mine-info";
  const name = document.createElement("div");
  name.className = "mine-name";
  name.textContent = r.name || r.label;
  const kind = document.createElement("div");
  kind.className = "mine-kind";
  kind.textContent = r.name ? r.label : "";
  info.append(name, kind);
  const del = document.createElement("button");
  del.className = "mine-del";
  del.type = "button";
  del.setAttribute("aria-label", "Smazat");
  del.textContent = "✕";
  del.addEventListener("click", () => askDelete(row, r));
  row.append(thumb, info, del);
  return row;
}

function askDelete(row, r) {
  row.replaceChildren();
  row.classList.add("confirm");
  const text = document.createElement("div");
  text.textContent = "Fakt smazat " + (r.name ? r.name + ", tvého " : "tohoto ") + r.label + "?";
  const buttons = document.createElement("div");
  buttons.className = "row";
  const yes = document.createElement("button");
  yes.className = "btn danger-solid";
  yes.type = "button";
  yes.textContent = "Ano, smazat";
  const no = document.createElement("button");
  no.className = "btn ghost";
  no.type = "button";
  no.textContent = "Ne";
  no.addEventListener("click", () => row.replaceWith(mineRow(r)));
  yes.addEventListener("click", async () => {
    yes.disabled = no.disabled = true;
    const res = await api("/api/rigs/" + r.id + "?device=" + encodeURIComponent(DEVICE),
                          { method: "DELETE" });
    if (res.ok) { row.remove(); if (!$("mine").children.length) loadMine(); return; }
    text.textContent = errorText(res, "Smazání se nepovedlo, zkus to znovu.");
    yes.disabled = no.disabled = false;
  });
  buttons.append(yes, no);
  row.append(text, buttons);
}

async function loadMine() {
  const r = await api("/api/rigs?s=" + encodeURIComponent(STATION) +
                      "&mine=" + encodeURIComponent(DEVICE));
  const box = $("mine");
  box.replaceChildren();
  const list = r.ok ? r.data : [];
  if (!list.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Zatím jsi nic nepřidal(a).";
    box.append(empty);
    return;
  }
  list.slice().reverse().forEach((m) => box.append(mineRow(m)));
}

// --- Zradlo a „jeste chvili“ -------------------------------------------------

let feedNoteTimer = 0;
function feedNote(text, ok) {
  $("feedNote").textContent = text;
  $("feedNote").className = ok ? "ok" : "bad";
  clearTimeout(feedNoteTimer);
  feedNoteTimer = setTimeout(() => { $("feedNote").textContent = ""; }, 6000);
}

$("feedBtn").addEventListener("click", async () => {
  $("feedBtn").disabled = true;
  const r = await api("/api/feed", { body: { s: STATION } });
  if (r.status === 404) { showEnded(); return; }
  if (r.ok) feedNote("Žrádlo letí — koukni na televizi! 🍖", true);
  else feedNote(errorText(r, "Nepodařilo se hodit žrádlo, zkus to znovu."), false);
  setTimeout(() => { $("feedBtn").disabled = false; }, 2000);
});

// Upload i krmeni stanici budi samy; tohle je pro chvile, kdy se jen kouka.
$("stay").addEventListener("click", async () => {
  $("stay").disabled = true;
  await api("/api/session/touch", { body: { s: STATION } });
  $("stayNote").textContent = "Stanice zůstane vzhůru. 🌞";
  setTimeout(() => { $("stayNote").textContent = ""; $("stay").disabled = false; }, 4000);
});

// --- Start a zive zmeny ------------------------------------------------------

(async () => {
  if (!(await loadScene())) return;
  loadMine();
  const stop = liveSocket("/ws?s=" + encodeURIComponent(STATION), (msg) => {
    if (msg.type === "ended") { stop(); showEnded(); }
    else if (msg.type === "scene") loadScene();
    else if (msg.type === "remove" || msg.type === "cleared") loadMine();
  });
})();
</script>
</body>
</html>
